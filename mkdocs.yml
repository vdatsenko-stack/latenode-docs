# ============================================
# === ФАЙЛ 1: mkdocs.yml (в корне проекта) ===
# ============================================

site_name: Latenode Documentation

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand

  logo: assets/svg1000transparent.svg
  favicon: assets/svg1000transparent.svg

  font:
    text: Inter
    code: Roboto Mono

  palette:
    - scheme: slate
      primary: 'deep-purple'
      accent: 'deep-purple'
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - scheme: default
      primary: 'deep-purple'
      accent: 'deep-purple'
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

plugins:
  - search
  - awesome-pages

extra_css:
  - stylesheets/extra.css

# В ЭТОМ ФАЙЛЕ НЕ ДОЛЖНО БЫТЬ СЕКЦИИ 'nav:'