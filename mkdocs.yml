# ===============================================
# === LATENODE DOCUMENTATION CONFIG (UPDATED) ===
# ===============================================

site_name: Latenode Documentation
site_url: http://146.190.122.174/

theme:
  name: material
  logo: assets/svg1000transparent.svg
  favicon: assets/svg1000transparent.svg

  font:
    text: Inter
    code: Roboto Mono

  features:
    - navigation.tabs       # Вкладки сверху
    - navigation.sections   # Боковые секции
    - navigation.expand     # Раскрывающиеся подразделы

  palette:
    - scheme: slate
      primary: 'deep-purple'
      accent: 'deep-purple'
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - scheme: default
      primary: 'deep-purple'
      accent: 'deep-purple'
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

  # --- FOOTER ---
  copyright: Copyright &copy; 2025 Latenode
  footer:
    links:
      - name: "🏠 Home"
        link: /
      - name: "📚 Documentation"
        link: /documentation/
      - name: "🧩 Integrations"
        link: /integrations/
      - name: "🎨 White Label"
        link: /white_label/
      - name: "📝 Changelog"
        link: /changelog/

plugins:
  - search
  - awesome-pages

extra_css:
  - stylesheets/extra.css

extra:
  generator: false

# --- MAIN NAVIGATION ---
nav:
  - 🏠 Home: index.md
  - 📚 Documentation: documentation/index.md
  - 🧩 Integrations: integrations/index.md
  - 🎨 White Label: white_label/index.md
  - 📝 Changelog: changelog/index.md
