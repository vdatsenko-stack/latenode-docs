# =======================================================
# === FINAL mkdocs.yml WITH ENGLISH FOOTER NAVIGATION ===
# =======================================================

site_url: http://146.190.122.174/

site_name: Latenode Documentation

theme:
  name: material
  features:
    - navigation.tabs

  logo: assets/svg1000transparent.svg
  favicon: assets/svg1000transparent.svg

  font:
    text: Inter
    code: Roboto Mono

  palette:
    - scheme: slate
      primary: 'deep-purple'
      accent: 'deep-purple'
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - scheme: default
      primary: 'deep-purple'
      accent: 'deep-purple'
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  
  # --- START OF THE UPDATED FOOTER SECTION ---

  # Copyright notice in English
  copyright: Copyright &copy; 2025 Latenode

  # Footer navigation in English, mirroring the main site navigation
  footer:
    links:
      - name: "🏠 Home"
        link: /introduction/
      - name: "📚 Documentation"
        link: /documentation/
      - name: "🧩 Integrations"
        link: /integrations/
      - name: "🎨 White Label"
        link: /white_label/
      - name: "📝 Changelog"
        link: /changelog/

  # --- END OF THE UPDATED FOOTER SECTION ---

plugins:
  - search
  - awesome-pages

extra_css:
  - stylesheets/extra.css

extra:
  generator: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
