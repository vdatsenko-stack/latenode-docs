# ===============================================
# === LATENODE DOCUMENTATION CONFIG (UPDATED) ===
# ===============================================

site_name: Latenode Documentation
site_url: http://146.190.122.174/

theme:
  name: material
  logo: assets/svg1000transparent.svg
  favicon: assets/svg1000transparent.svg

  font:
    text: Inter
    code: Roboto Mono

  features:
    - navigation.tabs       # Вкладки сверху
    - navigation.sections   # Боковые секции
    - navigation.expand     # Раскрывающиеся подразделы
    - navigation.top
    - navigation.tracking
    - toc.integrate

  palette:
    - scheme: slate
      primary: 'deep-purple'
      accent: 'deep-purple'
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - scheme: default
      primary: 'deep-purple'
      accent: 'deep-purple'
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

  # --- FOOTER ---
  copyright: Copyright &copy; 2025 Latenode
  footer:
    links:
      - name: "📚 Documentation"
        link: /documentation/
      - name: "🧩 Integrations"
        link: /integrations/
      - name: "🎨 White Label"
        link: /white_label/
      - name: "📝 Changelog"
        link: /changelog/

plugins:
  - search
  - awesome-pages

extra_css:
  - stylesheets/extra.css

extra:
  generator: false

# --- MAIN NAVIGATION ---
nav:
  - Introduction: index.md
  - 📚 Documentation:
      - Overview: documentation/index.md
      - 🚀 Get Started:
          - Introduction: documentation/get-started/introduction.md
          - Installation: documentation/get-started/installation.md
          - Quickstart: documentation/get-started/quickstart.md
      - 🛠️ Visual Builder:
          - Overview: documentation/visual-builder/index.md
          - Nodes:
              - Basic Nodes: documentation/visual-builder/nodes/basic.md
              - Advanced Nodes: documentation/visual-builder/nodes/advanced.md
          - Workflows:
              - Create & Run: documentation/visual-builder/workflows/create-run.md
              - Export & Import: documentation/visual-builder/workflows/export-import.md
      - 🦾 AI Agents:
          - Overview: documentation/ai-agents/index.md
          - Build Agent: documentation/ai-agents/build.md
          - Integrations: documentation/ai-agents/integrations.md
          - Prompts:
              - System Prompts: documentation/ai-agents/prompts/system.md
              - User Prompts: documentation/ai-agents/prompts/user.md
      - 🗃️ Databases:
          - Overview: documentation/databases/index.md
          - Connections: documentation/databases/connections.md
          - Query Examples: documentation/databases/queries.md
      - 👤 Account Management:
          - Overview: documentation/account/index.md
          - Profile Settings: documentation/account/profile.md
          - API Keys: documentation/account/api-keys.md
          - Team Management:
              - Add Members: documentation/account/team/add.md
              - Permissions: documentation/account/team/permissions.md
      - ❓ FAQ:
          - General: documentation/faq/general.md
          - Troubleshooting: documentation/faq/troubleshooting.md
  - 🧩 Integrations: integrations/index.md
  - 🎨 White Label: white_label/index.md
  - 📝 Changelog: changelog/index.md
