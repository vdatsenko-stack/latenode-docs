name: Build and Deploy Docusaurus Site

# ЗАПУСКАТЬ ТОЛЬКО ПО ВНЕШНЕЙ КОМАНДЕ
on:
  repository_dispatch:
    types: [build-command] # Мы будем ждать команду с типом 'build-command'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # --- ЭТАП 1: ПОДГОТОВКА ---
      - name: 1. Checkout Site Code
        uses: actions/checkout@v4
        with:
          repository: saxtamazer/latenode-docusaurus-site
          path: main-site # Клонируем код сайта в папку 'main-site'

      - name: 2. Checkout Content
        uses: actions/checkout@v4
        with:
          repository: vdatsenko-stack/latenode-docs
          path: content-repo # Клонируем контент в папку 'content-repo'

      - name: 3. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # --- ЭТАП 2: СБОРКА САЙТА ---
      - name: 4. Prepare Site Files
        run: |
          # Этот шаг имитирует ваш sync_content.sh, но прямо здесь, в Actions
          echo "Syncing content into the site structure..."
          # Копируем контент из 'content-repo' в нужные папки 'main-site'
          # Используйте rsync для надежного копирования
          rsync -a --delete ./content-repo/documentation/ ./main-site/platform-documentation/
          rsync -a --delete ./content-repo/integrations/ ./main-site/integrations/
          rsync -a --delete ./content-repo/white_label/ ./main-site/white-label/
          rsync -a --delete ./content-repo/changelog/ ./main-site/changelog/
          cp ./content-repo/introduction.md ./main-site/introduction.md

      - name: 5. Install Dependencies and Build
        working-directory: ./main-site # Выполняем команды внутри папки с сайтом
        run: |
          npm install
          npm run build

      # --- ЭТАП 3: РАЗВЕРТЫВАНИЕ НА СЕРВЕРЕ ---
      - name: 6. Deploy build to Server
        uses: appleboy/scp-action@v1.0.1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "./main-site/build/" # Что копируем (папка со сборкой)
          target: "/var/www/my-docusaurus-site/staging" # Куда копируем на сервере (во временную папку)

      - name: 7. Activate New Release
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Атомарно заменяем содержимое основной папки на содержимое из временной
            # Это аналог вашей схемы с релизами, но проще
            rm -rf /var/www/my-docusaurus-site/current_BACKUP
            mv /var/www/my-docusaurus-site/current /var/www/my-docusaurus-site/current_BACKUP || true
            mv /var/www/my-docusaurus-site/staging /var/www/my-docusaurus-site/current
            echo "Deployment successful!"
