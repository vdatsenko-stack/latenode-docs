name: Lint, Format, and Trigger Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  lint-and-format:
    # ... (эта часть остается без изменений) ...
    if: "!contains(github.event.head_commit.message, 'chore: auto-format')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install Tools and Dependencies
        run: |
          npm install -g prettier markdownlint-cli
          npm install glob
      - name: Fix Content Issues
        run: node .github/scripts/fix-content.js
      - name: Auto-fix and Format Markdown Files
        run: |
          markdownlint --fix ./**/*.md || true
          prettier --write ./**/*.md
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-format markdown files"

  # ЗАДАНИЕ 2: ОТДАТЬ ПРИКАЗ НА СБОРКУ
  trigger-build:
    needs: lint-and-format
    if: "contains(github.event.head_commit.message, '[deploy]') && !contains(github.event.head_commit.message, 'chore: auto-format')"
    runs-on: ubuntu-latest
    steps:
      - name: Send 'build' command to the site repository
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PAT_TRIGGER }} # Используем наш новый токен
          repository: saxtamazer/latenode-docusaurus-site # Репозиторий-"фабрика"
          event-type: build-command # Название команды, которую ждет "фабрика"
