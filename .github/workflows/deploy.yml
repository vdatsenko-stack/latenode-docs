name: Deploy Latenode Documentation

# Триггер: запускать при пуше в ветку 'main'
on:
  push:
    branches:
      - main

jobs:
  deploy:
    # Условие: запускать, только если в сообщении последнего коммита есть слово "deploy"
    if: contains(github.event.head_commit.message, 'deploy')
    
    name: Build and Deploy
    runs-on: ubuntu-latest # Использовать виртуальную машину с Ubuntu

    steps:
      # 1. Получение кода из репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Настройка Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Укажите версию Python

      # 3. Установка зависимостей из requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Сборка статического сайта. Результат будет в папке 'site'
      - name: Build MkDocs site
        run: mkdocs build

      # 5. Копирование собранных файлов на сервер
      - name: Deploy to server
        uses: easingthemes/ssh-deploy@v5
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SOURCE: "site/" # Какую папку копировать
          TARGET: ${{ secrets.TARGET_DIR }} # Куда копировать на сервере

      # 6. Запуск скрипта на сервере для завершения развертывания
      - name: Execute post-deployment script
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: /var/www/latenode-docs/scripts/deploy.sh