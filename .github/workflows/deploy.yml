name: Deploy Latenode Docs via SSH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    # Запускать, только если в сообщении коммита есть слово "deploy"
    if: contains(github.event.head_commit.message, 'deploy')

    runs-on: ubuntu-latest
    name: Trigger deployment on server

    steps:
      # Шаг 1: Установка SSH ключа для доступа к серверу
      # Используем те же переменные, что и в вашем примере
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Шаг 2: Подключение к серверу и запуск скрипта развертывания
      - name: Connect and run the deploy script
        run: |
          # Добавляем сервер в список известных хостов, чтобы избежать интерактивных запросов
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          
          # Подключаемся и запускаем наш скрипт на сервере
          # Путь к каталогу прописан вручную, как вы просили
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "bash /var/www/latenode-docs/deploy.sh"